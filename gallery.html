<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="gallery.title">Photo Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">La Figueirette</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html" data-i18n="nav.home">Home</a></li>
          <li><a href="gallery.html" class="active" data-i18n="nav.gallery">Photos</a></li>
          <li><a href="index.html#contact" data-i18n="nav.contact">Contact</a></li>
        </ul>
      </nav>
      <button class="lang-toggle" data-lang-toggle type="button" aria-label="Switch language">FR</button>
    </div>
  </header>

  <section class="container gallery-page">
    <p class="gallery-back"><a href="index.html" data-i18n="gallery.back">&larr; Back to home</a></p>
    <h1 data-i18n="gallery.title">Photo Gallery</h1>

    <div class="slideshow" id="slideshow">
      <button class="slide-nav slide-prev" id="prevBtn" aria-label="Previous photo">&#10094;</button>
      <img id="slideImage" src="" alt="Property photo" class="slide-image">
      <button class="slide-nav slide-next" id="nextBtn" aria-label="Next photo">&#10095;</button>
      <div class="slide-counter" id="slideCounter"></div>
    </div>

    <div class="thumb-strip" id="thumbStrip"></div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer.note">Direct booking only &mdash; this is not an Airbnb listing.</p>
      <p>&copy; <span id="year"></span> La Figueirette &middot; Théoule-sur-Mer</p>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
